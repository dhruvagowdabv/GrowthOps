name: Backend tests

on:
  push:
    branches:
      - feature/growthops-v2
  pull_request:
    branches:
      - feature/growthops-v2

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: growthops
          POSTGRES_USER: growthops
          POSTGRES_PASSWORD: growthops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthops -d growthops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://growthops:growthops@localhost:5432/growthops
      UPLOAD_DIR: data/uploads
      BUSINESS_DATA_DIR: data/business
      VERSION_DIR: data/versions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Apply database migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Run backend test suite
        run: pytest -q
        working-directory: backend
