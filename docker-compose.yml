services:
  postgres:
    image: postgres:16-alpine
    container_name: growthops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: growthops
      POSTGRES_USER: growthops
      POSTGRES_PASSWORD: growthops
    ports:
      - "5432:5432"
    volumes:
      - growthops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthops -d growthops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  growthops_postgres_data:
